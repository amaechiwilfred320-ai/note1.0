name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
      - name: Install OLD pip that Buildozer understands
        run: |
          python3 -m pip install --upgrade "pip==23.3.1" "setuptools==68.0.0" "wheel==0.41.2"
          pip --version
      - name: Install Buildozer
        run: |
          pip install Cython==0.29.33
          pip install buildozer
          buildozer --version
      - name: Build APK
        run: |
          yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Date-APK
          path: bin/*.apk
